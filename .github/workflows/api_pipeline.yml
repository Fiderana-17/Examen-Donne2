name: AQI Pipeline

on:
  schedule:
    - cron: '5 * * * *'      # toutes les heures, à H:05
  workflow_dispatch: {}       # permet de lancer manuellement depuis l'onglet Actions

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Fetch current AQI data
        run: python ingestion/fetch_api.py
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}

      - name: Rebuild clean.csv
        run: python transform/build_clean.py
        env: {}

      - name: Load warehouse
        run: python warehouse/load_warehouse.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Commit raw/ and clean/ back to repo
        run: |
          git config user.name "aqi-pipeline-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add storage/raw storage/clean
          git diff --staged --quiet || git commit -m "chore: pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push